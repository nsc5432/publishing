<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <style>
    /* 점들을 품은 그룹: 중앙(60,60)을 기준으로 정밀 회전 */
    .sk-child-group {
      transform-origin: 60px 60px;
    }

    /* 점 자체: 제자리(60,0) 중심축 기준으로 완벽히 대칭 스케일 적용 */
    .sk-dot {
      fill: #50c8d9;
      transform-origin: 60px 0px; 
      will-change: transform, opacity;
      animation: sk-circleBounceDelay 2.5s infinite ease-in-out both;
      animation-delay: var(--delay);
    }
    
    /* 비행기 회전: 점들과 똑같이 (60,60) 중심축을 공유하여 기하학적 일치 구현 */
    .pure-svg-spin {
      transform-origin: 60px 60px;
      will-change: transform;
      animation: svgSpin 2.5s infinite linear;
    }

    @keyframes svgSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes sk-circleBounceDelay {
      0%, 20%, 60% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(0);
        opacity: 1;
      }
    }
  </style>

  <defs>
