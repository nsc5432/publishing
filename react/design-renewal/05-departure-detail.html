<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>시안 05 — 출국장 · 블럭 상세</title>
<link rel="stylesheet" href="mock.css" />
</head>
<body>
<script src="mock.js"></script>
<script>
/* 리뉴얼 핵심 화면 ④
   출국장 블럭(4번)을 클릭하면 우측 상세 패널에서
   사용/미사용 · 운영시간 · 검색대 구성 · 시간대별 검색대 갯수를 한자리에서 관리한다.
   구 '보안 검색대' 탭의 표(시작/종료 + 갯수)는 여기 남기고,
   그 결과가 시간대별로 어떻게 깔리는지는 값이 찍힌 운영 슬롯으로 함께 보여준다. */

var T1_GATES = [
    { label: '1', color: 'i1', from: 5, to: 22, sec: 8 },
    { label: '3', color: 'i2', from: 6, to: 21, sec: 6 },
    { label: '4', color: 'i3', from: 6, to: 20, sec: 10 },
    { label: '6', color: 'i4', from: 7, to: 19, sec: 4 },
];

var T2_GATES = [
    { label: '1', color: 'i1', from: 7, to: 21, sec: 5 },
];

/* 시간대별 대기인원수 (명) — 우측 축 0 ~ 300 */
var T1_WAIT = [0, 0, 0, 0, 0, 25, 90, 180, 260, 230, 190, 210,
               240, 270, 220, 180, 150, 120, 95, 65, 35, 12, 0, 0];
var T2_WAIT = [0, 0, 0, 0, 0, 0, 0, 30, 55, 48, 40, 44,
               50, 58, 47, 38, 30, 24, 18, 12, 6, 0, 0, 0];

function legendOf(list) {
    return list.map(function (g) {
        return { label: g.label + '출국장', color: g.color, note: '검색대 ' + g.sec };
    });
}

function secItems(list) {
    return list.map(function (g) {
        return { label: g.label, color: g.color, from: g.from, to: g.to, size: g.sec };
    });
}

function secChart(list, offGates) {
    var chips = offGates.map(function (n) {
        return '<span class="offchip">' + n + '번 출국장</span>';
    }).join('');
    return blockChart(secItems(list), {
        title: '시간대별 보안검색대',
        unit: '(단위: 검색대 수)',
        unitNote: '1블럭 = 검색대 4대 · 초기값',
        levels: 8,
        rowH: 14,
        unitSize: 4,
        compact: true,
        scale: false, /* 시간축은 바로 위 출국장 차트와 같으므로 생략 */
        headExtra: '<div class="offchips" style="margin:0 0 0 auto">미운영' + chips + '</div>',
        headActions: [['even', '균등 배치']],
        foot: false,
    });
}

function panel(kind, disabled) {
    var t1 = kind === 't1';
    var list = t1 ? T1_GATES : T2_GATES;

    return '<section class="panel' + (disabled ? ' panel--disabled' : '') + '">' +
        panelHead(kind, [
            ['전체 출국장', t1 ? '6' : '2'],
            ['운영', t1 ? '4' : '1', true],
            ['피크 검색대', t1 ? '28' : '5', true],
        ], true, t1
            ? [['평균대기', '15', '분'], ['P95대기', '12', '분'],
               ['최대 큐인원', '20', '명'], ['가동률', '84', '%']]
            : [['평균대기', '6', '분'], ['P95대기', '5', '분'],
               ['최대 큐인원', '8', '명'], ['가동률', '47', '%']]) +
        blockChart(list, {
            title: '시간대별 운영 출국장',
            unit: '(단위: 출국장 수)',
            levels: 6,
            rowH: 22,
            blkFs: 13,
            legend: legendOf(list),
            line: { data: t1 ? T1_WAIT : T2_WAIT, max: 300, label: '대기인원수', unit: '명' },
            footText: '블럭을 클릭하면 출국장별 운영시간·검색대를 관리합니다. 초기값은 배정정보로 채워집니다.',
            actions: [['add', '+ 추가'], ['adv', '세부 운영시간 직접 설정 →']],
            picking: t1,
            sel: t1 ? { label: '4' } : null,
        }) +
        secChart(list, t1 ? [2, 5] : [2]) +
        '<div class="panel__foot">' +
        (disabled ? '' : '<button class="btn btn--save">현재상태 저장</button>') +
        '</div></section>';
}

var PLAN_ROWS = [
    ['06:00', '08:00', 4],
    ['08:00', '12:00', 10],
    ['12:00', '16:00', 8],
    ['16:00', '20:00', 6],
];

/* 위 구간표가 시간대별로 깔린 결과 — 운영 슬롯 안에 검색대 대수를 찍는다 */
function planByHour() {
    var out = {};
    PLAN_ROWS.forEach(function (r) {
        var from = parseInt(r[0], 10);
        var to = parseInt(r[1], 10);
        for (var h = from; h < to; h++) out[h] = r[2];
    });
    return out;
}

function stepperRow(label, sub, value) {
    return '<div class="drow"><p class="drow__label">' + label +
        (sub ? '<small>' + sub + '</small>' : '') + '</p>' +
        '<div class="stepper"><span class="stepper__btn">−</span>' +
        '<span class="stepper__value">' + value + '</span>' +
        '<span class="stepper__btn">+</span></div></div>';
}

function planTable() {
    var html = '<div class="plan"><table>' +
        '<thead><tr><th>시작</th><th>종료</th><th class="col-cnt">검색대</th>' +
        '<th class="col-del"></th></tr></thead><tbody>';
    PLAN_ROWS.forEach(function (r, i) {
        html += '<tr' + (i === 1 ? ' class="is-sel"' : '') + '><td><b>' + r[0] + '</b></td>' +
            '<td><b>' + r[1] + '</b></td>' +
            '<td class="col-cnt"><b>' + r[2] + '</b> 개</td>' +
            '<td class="col-del"><span class="plan__del">✕</span></td></tr>';
    });
    return html + '</tbody></table></div>';
}

var drawer =
    '<aside class="drawer">' +
    '<div class="drawer__head">' +
    '<span class="drawer__badge" style="background:var(--i3)">4</span>' +
    '<div class="drawer__titles"><p class="drawer__title">4번 출국장</p>' +
    '<p class="drawer__sub">T1 · 06:00 ~ 20:00 운영 (14시간)</p></div>' +
    '<span class="drawer__close">' + ICON.close + '</span></div>' +

    '<div class="drawer__body">' +

    '<div class="dsec"><div class="drow" style="padding-top:0">' +
    '<p class="drow__label">출국장 운영 여부</p>' +
    '<div class="seg"><button class="seg__item is-on">사용</button>' +
    '<button class="seg__item">미사용</button></div></div></div>' +

    '<div class="dsec"><p class="dsec__title">운영시간' +
    '<span class="dsec__hint">슬롯 안 숫자 = 시간대별 검색대 대수</span></p>' +
    timebar('선택 범위', '06:00 ~ 20:00', [[6, 20]], { values: planByHour() }) + '</div>' +

    '<div class="dsec"><p class="dsec__title">검색대 구성' +
    '<span class="dsec__hint">4번 출국장 소속</span></p>' +
    stepperRow('일반', null, '3') +
    stepperRow('스마트패스', null, '2') +
    stepperRow('보안검색대', '피크 시간대 기준', '10') + '</div>' +

    '<div class="dsec"><p class="dsec__title">보안검색대 운영계획' +
    '<span class="dsec__hint" style="margin-left:auto;display:flex;gap:6px">' +
    '<span class="btn--even">균등 배치</span>' +
    '<span class="btn--add">+ 구간 추가</span></span></p>' +
    planTable() +
    '</div>' +

    '</div>' +

    '<div class="drawer__foot">' +
    '<button class="btn btn--ghost">취소</button>' +
    '<button class="btn btn--primary">변경</button></div></aside>';

renderShell('출국장', panel('t1', false) + panel('t2', true), drawer);
</script>
</body>
</html>
