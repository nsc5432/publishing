<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>시안 04 — 출국장 (블럭 차트)</title>
<link rel="stylesheet" href="mock.css" />
</head>
<body>
<script src="mock.js"></script>
<script>
/* 리뉴얼 핵심 화면 ③
   출국장도 같은 블럭 차트 문법을 쓴다. 블럭 1개 = 출국장 1개 × 1시간, 중앙에 출국장 번호.
   구 '보안 검색대' 탭은 출국장 안으로 흡수되어, 아래에 보조 블럭 차트로 붙는다.
   (검색대는 규모가 크므로 블럭 1개 = 검색대 4대로 스케일링) */

var T1_GATES = [
    { label: '1', color: 'i1', from: 5, to: 22, sec: 8 },
    { label: '3', color: 'i2', from: 6, to: 21, sec: 6 },
    { label: '4', color: 'i3', from: 6, to: 20, sec: 10 },
    { label: '6', color: 'i4', from: 7, to: 19, sec: 4 },
];

var T2_GATES = [
    { label: '1', color: 'i1', from: 7, to: 21, sec: 5 },
];

/* 시간대별 대기인원수 (명) — 우측 축 0 ~ 300 */
var T1_WAIT = [0, 0, 0, 0, 0, 25, 90, 180, 260, 230, 190, 210,
               240, 270, 220, 180, 150, 120, 95, 65, 35, 12, 0, 0];
var T2_WAIT = [0, 0, 0, 0, 0, 0, 0, 30, 55, 48, 40, 44,
               50, 58, 47, 38, 30, 24, 18, 12, 6, 0, 0, 0];

function legendOf(list) {
    return list.map(function (g) {
        return { label: g.label + '출국장', color: g.color, note: '검색대 ' + g.sec };
    });
}

/* 출국장 블럭은 1칸 = 출국장 1개, 검색대 차트는 1칸 = 검색대 4대 */
function secItems(list) {
    return list.map(function (g) {
        return { label: g.label, color: g.color, from: g.from, to: g.to, size: g.sec };
    });
}

function gateChart(t1, list, extra) {
    var o = {
        title: '시간대별 운영 출국장',
        unit: '(단위: 출국장 수)',
        levels: 6,
        rowH: 22,
        blkFs: 13,
        legend: legendOf(list),
        line: { data: t1 ? T1_WAIT : T2_WAIT, max: 300, label: '대기인원수', unit: '명' },
        footText: '블럭을 클릭하면 출국장별 운영시간·검색대를 관리합니다. 초기값은 배정정보로 채워집니다.',
        actions: [['add', '+ 추가'], ['adv', '세부 운영시간 직접 설정 →']],
    };
    for (var k in extra) o[k] = extra[k];
    return blockChart(list, o);
}

/* 구 '보안 검색대' 탭 — 출국장 차트 아래 보조 차트로 붙는다.
   범례가 없으므로 미운영 칩과 '균등 배치'를 헤드 우측에 두고 푸터 한 줄을 아낀다. */
function secChart(list, offGates) {
    var chips = offGates.map(function (n) {
        return '<span class="offchip">' + n + '번 출국장</span>';
    }).join('');
    return blockChart(secItems(list), {
        title: '시간대별 보안검색대',
        unit: '(단위: 검색대 수)',
        unitNote: '1블럭 = 검색대 4대 · 초기값',
        levels: 8,
        rowH: 14,
        unitSize: 4,
        compact: true,
        scale: false, /* 시간축은 바로 위 출국장 차트와 같으므로 생략 */
        headExtra: '<div class="offchips" style="margin:0 0 0 auto">미운영' + chips + '</div>',
        headActions: [['even', '균등 배치']],
        foot: false,
    });
}

function panel(kind, disabled) {
    var t1 = kind === 't1';
    var list = t1 ? T1_GATES : T2_GATES;

    return '<section class="panel' + (disabled ? ' panel--disabled' : '') + '">' +
        panelHead(kind, [
            ['전체 출국장', t1 ? '6' : '2'],
            ['운영', t1 ? '4' : '1', true],
            ['피크 검색대', t1 ? '28' : '5', true],
        ], true, t1
            ? [['평균대기', '15', '분'], ['P95대기', '12', '분'],
               ['최대 큐인원', '20', '명'], ['가동률', '84', '%']]
            : [['평균대기', '6', '분'], ['P95대기', '5', '분'],
               ['최대 큐인원', '8', '명'], ['가동률', '47', '%']]) +
        gateChart(t1, list, {
            hover: t1 ? { label: '4', hour: 9, tip: '4번 출국장 · 보안검색대 10대 · 09:00 ~ 10:00' } : null,
        }) +
        secChart(list, t1 ? [2, 5] : [2]) +
        '<div class="panel__foot">' +
        (disabled ? '' : '<button class="btn btn--save">현재상태 저장</button>') +
        '</div></section>';
}

renderShell('출국장', panel('t1', false) + panel('t2', true));
</script>
</body>
</html>
