<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>시안 04 — 출국장 (블럭 차트)</title>
<link rel="stylesheet" href="mock.css" />
</head>
<body>
<script src="mock.js"></script>
<script>
/* 리뉴얼 핵심 화면 ③
   출국장도 같은 블럭 차트 문법을 쓴다. 블럭 1개 = 출국장 1개 × 1시간, 중앙에 출국장 번호.
   구 '보안 검색대' 탭은 출국장 안으로 흡수되어, 검색대 갯수는 블럭 상세에서 관리한다. */

var T1_GATES = [
    { label: '1', level: 1, color: 'i1', from: 5, to: 22, sec: 8 },
    { label: '3', level: 2, color: 'i2', from: 6, to: 21, sec: 6 },
    { label: '4', level: 3, color: 'i3', from: 6, to: 20, sec: 10 },
    { label: '6', level: 4, color: 'i4', from: 7, to: 19, sec: 4 },
];

var T2_GATES = [
    { label: '1', level: 1, color: 'i1', from: 7, to: 21, sec: 5 },
];

function legendOf(list) {
    return list.map(function (g) {
        return { label: g.label + '출국장', color: g.color, note: '검색대 ' + g.sec };
    });
}

function secbar(peak, offGates) {
    var chips = offGates.map(function (n) {
        return '<span class="offchip">' + n + '번 출국장</span>';
    }).join('');
    return '<div class="selfbar">' +
        '<p class="selfbar__title">보안 검색대<span>출국장에 통합</span></p>' +
        '<div class="selfbar__items">' +
        '<span class="selfbar__item">피크 시간대 <b>' + peak + '</b>대 동시 운영</span></div>' +
        '<div class="offchips" style="margin:0 0 0 auto">미운영' + chips + '</div></div>';
}

function panel(kind, disabled) {
    var t1 = kind === 't1';
    var list = t1 ? T1_GATES : T2_GATES;

    return '<section class="panel' + (disabled ? ' panel--disabled' : '') + '">' +
        panelHead(kind, [
            ['전체 출국장', t1 ? '6' : '2'],
            ['운영', t1 ? '4' : '1', true],
            ['피크 검색대', t1 ? '28' : '5', true],
        ], true) +
        blockChart(list, {
            title: '시간대별 운영 출국장',
            unit: '(단위: 출국장 수)',
            levels: 6,
            rowH: 40,
            blkFs: 14,
            legend: legendOf(list),
            footText: '블럭 1개 = 출국장 1개. 클릭하면 운영시간·보안검색대 갯수를 관리합니다.',
            hover: t1 ? { hour: 12, level: 4, tip: '6번 출국장 · 보안검색대 4대 · 12:00 ~ 13:00' } : null,
        }) +
        secbar(t1 ? 28 : 5, t1 ? [2, 5] : [2]) +
        '<div class="panel__foot">' +
        (disabled ? '' : '<button class="btn btn--save">현재상태 저장</button>') +
        '</div></section>';
}

renderShell('출국장', panel('t1', false) + panel('t2', true));
</script>
</body>
</html>
