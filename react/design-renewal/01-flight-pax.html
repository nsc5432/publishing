<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>시안 01 — 운항편/여객수</title>
<link rel="stylesheet" href="mock.css" />
</head>
<body>
<script src="mock.js"></script>
<script>
/* 운항편/여객수 탭은 리뉴얼 대상이 아니다.
   달라지는 것은 탭이 5개 → 3개로 줄었다는 점뿐이라는 것을 보여주기 위한 시안. */

var FLIGHT = [8, 14, 10, 34, 40, 62, 50, 58, 30, 28, 12, 6];
var PAX    = [6, 12, 9, 30, 36, 66, 54, 62, 26, 30, 14, 5];
var SCALE  = ['04','06','08','10','12','14','16','18','20','22','00','02'];

function barChart(title, total, unit, data, dim) {
    var html = '<div class="chart"><div class="chart__head">' +
        '<p class="chart__title">' + title + '</p>' +
        '<p class="chart__total">전체(누적) <b>' + total + '</b> ' + unit + '</p></div>';

    html += '<div class="chart__plot"><div class="chart__axis">' +
        '<span>0</span><span>100</span><span>200</span><span>300</span></div>' +
        '<div class="chart__bars">';
    data.forEach(function (h) {
        html += '<span class="bar" style="--h:' + h + 'px' + (dim ? ';background:linear-gradient(180deg,#8e9199,#5d6067)' : '') + '"></span>';
    });
    html += '</div></div><div class="chart__scale">';
    SCALE.forEach(function (t) { html += '<span>' + t + '</span>'; });
    return html + '</div></div>';
}

function editor(ratio) {
    return '<div class="editor"><div class="editor__head"><div>' +
        '<label class="radio is-on"><i class="radio__mark"></i>운항편 전체 비율로 수정</label>' +
        '<label class="radio"><i class="radio__mark"></i>시간대별 운항편 수정</label>' +
        '</div><div class="stepper editor__stepper">' +
        '<span class="stepper__btn">‹</span><span class="stepper__value">' + ratio + '%</span>' +
        '<span class="stepper__btn">›</span></div></div>' +
        '<div class="table-wrap"><table class="data-table">' +
        '<thead><tr><th>시작시간</th><th>종료시간</th><th>수정</th><th>승객 수</th></tr></thead>' +
        '<tbody>' +
        '<tr><td>04:00</td><td>05:00</td><td>10%</td><td>12,340명</td></tr>' +
        '<tr><td>05:00</td><td>06:00</td><td>0%</td><td>18,220명</td></tr>' +
        '<tr><td>06:00</td><td>07:00</td><td>0%</td><td>24,780명</td></tr>' +
        '</tbody></table></div></div>';
}

function panel(kind, disabled) {
    var t1 = kind === 't1';
    return '<section class="panel' + (disabled ? ' panel--disabled' : '') + '">' +
        panelHead(kind, [
            ['운항편', t1 ? '15' : '9'],
            ['여객', t1 ? '1,234,567' : '842,310'],
            ['피크', t1 ? '14:00' : '16:00', true],
        ], false) +
        barChart('운항편 수', t1 ? '1,234' : '842', '편', FLIGHT, disabled) +
        barChart('여객 수', t1 ? '1,234,567' : '842,310', '명', PAX, disabled) +
        editor(t1 ? 10 : 0) +
        '<div class="panel__foot">' +
        (disabled ? '' : '<button class="btn btn--save">현재상태 저장</button>') +
        '</div></section>';
}

renderShell('운항편/여객수', panel('t1', false) + panel('t2', true));
</script>
</body>
</html>
